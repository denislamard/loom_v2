# Corpus de non-régression (J6.3b) : l'agent relance de examples/j4/relance, modèles simulés.
# Chaque journal de journaux/ doit se rejouer à l'identique (tests/regression/test_regression.py).
# Réenregistrer, après un changement voulu, et relire le diff :
#   uv run loom eval tests/regression/j4/relance.yaml --export tests/regression/j4/journaux/
config: ../../../examples/j4/relance/loom.yaml
agent: relance
cases:
  - name: relance-042
    input: Relance le client du devis D-2026-042, sur un ton cordial.
    expect:
      status: completed
      contains: [D-2026-042]
      called: [{name: chercher_devis, arguments: {numero: D-2026-042}}, rediger_relance]
  # La seconde demande de examples/j4/sessions.py, seule : le rôle est refusé tant
  # que le devis n'a pas été cherché dans le run, puis rappelé.
  - name: plus-breve
    input: Rends-la plus brève, trois phrases au plus.
    expect:
      status: completed
      contains: [D-2026-042]
      called: [{name: rediger_relance, arguments: {ton: bref}}, chercher_devis]
