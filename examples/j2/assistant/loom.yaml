# Configuration des exemples des phases 2.2 à 2.4 : un agent, deux serveurs
# MCP, un rôle vision et un sous-agent. Ce dossier grandira jusqu'au scénario
# final du jalon J2 (phase 2.5).
#
# Deux agents, même scénario :
#   assistant       modèles simulés (sdk: fake), sans clé ni réseau ;
#   assistant_reel  MiniMax-M3 (clé dans M3_API_KEY), Claude Haiku 4.5 pour
#                   le rôle vision (clé dans ANTHROPIC_API_KEY) et GLM-5.3-Flash
#                   pour le sous-agent (clé dans TOGETHER_API_KEY).
# Chacun a son sous-agent vérificateur : verificateur et verificateur_reel.
version: 1

agents_dir: agents/
prompts_dir: prompts/

models:
# Orchestrateur simulé : fait décrire la photo jointe s'il y en a une, lit
# l'heure et compte les jours (time), calcule (math), puis fait vérifier le
# résultat par le sous-agent. Une réponse avec with_tool (ou without_tool)
# n'est donnée que si cet outil est proposé (ou ne l'est pas) : le rôle vision
# n'est proposé que quand le run a une image.
- id: FAKE_MAIN
  sdk: fake
  model: fake-main
  params:
    script:
    - text: Je fais d'abord décrire la photo jointe.
      with_tool: decrire_image
      tool_calls:
      - name: decrire_image
        arguments: { consigne: Décris la photo en une phrase. }
    - text: Je lis l'heure et je compte les jours.
      tool_calls:
      - name: time__maintenant
        arguments: { fuseau: Europe/Paris }
      - name: time__jours_entre
        arguments: { debut: "2026-09-01", fin: "2026-12-31" }
    - tool_calls:
      - name: math__calculer
        arguments: { expression: "121 * 24" }
    - text: Je fais vérifier le résultat.
      tool_calls:
      - name: verifier
        arguments:
          message: >-
            Vérifie : entre le 2026-09-01 et le 2026-12-31, il y a 121 jours, soit 2 904 heures.
    - text: >-
        J'ai lu l'heure de Paris. Entre le 1er septembre et le 31 décembre 2026, il y a 121 jours, soit 2 904 heures.
      without_tool: decrire_image
    - text: >-
        La photo jointe montre un carré bleu sur fond blanc. J'ai lu l'heure de Paris. Entre le 1er septembre et le 31 décembre 2026, il y a 121 jours, soit 2 904 heures.
      with_tool: decrire_image

# Sous-agent vérificateur simulé : il recompte avec ses propres outils MCP.
- id: FAKE_CHECK
  sdk: fake
  model: fake-check
  params:
    script:
    - tool_calls:
      - name: time__jours_entre
        arguments: { debut: "2026-09-01", fin: "2026-12-31" }
      - name: math__calculer
        arguments: { expression: "121 * 24" }
    - text: "Vérifié : 121 jours, et 121 × 24 = 2 904 heures."

# Rôle vision simulé : la capacité vision lui fait recevoir les octets de l'image.
- id: FAKE_VISION
  sdk: fake
  model: fake-vision
  capabilities: { vision: true }
  params:
    script:
    - text: Un carré bleu sur fond blanc.

# Tarifs en $ par million de tokens, relevés le 18/09/2026 (palier ≤ 512k tokens).
- id: M3_MAIN
  sdk: anthropic
  base_url: https://api.minimax.io/anthropic
  model: MiniMax-M3
  api_key_env: M3_API_KEY
  max_tokens: 4096
  pricing: { input: 0.30, output: 1.20, cache_read: 0.06, cache_write: 0.30 }

# Modèle du rôle vision réel. Images en base64, 5 Mio au plus ; l'API accepte
# une image dans un résultat d'outil.
- id: HAIKU
  sdk: anthropic
  model: claude-haiku-4-5-20251001
  api_key_env: ANTHROPIC_API_KEY
  max_tokens: 4096
  capabilities:
    vision: true
    image_formats: [ jpeg, png, gif, webp ]
    max_image_bytes: 5242880
    tool_result_media: true
  pricing: { input: 1.0, output: 5.0, cache_read: 0.10, cache_write: 1.25 }

# gpt-oss-120b chez Together (API compatible OpenAI). Écarté du sous-agent :
# avec des outils, il enchaîne les appels sans attendre leurs résultats, puis
# renvoie son format interne en texte (raisonnement non renvoyé, backlog #015).
# Pas de tarif de cache publié : lecture comptée au prix de l'entrée, par prudence.
- id: GPT_OSS
  sdk: openai
  api: chat
  base_url: https://api.together.xyz/v1
  model: openai/gpt-oss-120b
  api_key_env: TOGETHER_API_KEY
  max_tokens: 2048
  pricing: { input: 0.15, output: 0.60, cache_read: 0.15 }

# Modèle du sous-agent réel : GLM-5.3-Flash chez Together (API compatible
# OpenAI). Tarifs en $ par million de tokens, relevés le 19/09/2026.
- id: GLM_FLASH
  sdk: openai
  api: chat
  base_url: https://api.together.xyz/v1
  model: zai-org/GLM-5.3-Flash
  api_key_env: TOGETHER_API_KEY
  max_tokens: 4096
  pricing: { input: 0.15, output: 0.50, cache_read: 0.03 }

# Serveurs locaux écrits avec FastMCP, lancés depuis ce dossier.
# « python » est celui de l'environnement : lancer l'exemple avec uv run.
mcp_servers:
- name: time
  transport: stdio
  command: python
  args: [ serveurs/serveur_time.py ]
  scope: shared # une connexion pour tous les runs du process
- name: math
  transport: stdio
  command: python
  args: [ serveurs/serveur_math.py ]
  scope: run # une connexion par run, refermée à la fin

storage:
  # Les fichiers (images jointes…) suivent le journal : data/.artifacts/.
  events: { backend: jsonl, path: data } # ignoré par git

telemetry:
  logging: { level: WARNING, format: console }
