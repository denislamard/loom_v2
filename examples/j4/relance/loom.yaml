# Configuration des exemples du jalon J4 : la relance de devis, en conversation.
# Elle part de celle du jalon J3 (politiques, contrat de sortie, juge, budget)
# et grandit de phase en phase jusqu'au scénario final du jalon.
#
# Deux agents, même scénario :
#   relance       modèles simulés (sdk: fake), sans clé ni réseau ;
#   relance_reel  MiniMax-M3 pour l'orchestrateur (clé dans M3_API_KEY),
#                 GLM-5.3-Flash chez Together pour le rôle (clé dans TOGETHER_API_KEY),
#                 Claude Haiku 4.5 pour le juge (clé dans ANTHROPIC_API_KEY).
#
# Phase 4.1a : sessions. Voir sessions.py (à côté). Deux runs partagent un
# journal : le second relit la conversation et sait de quel devis on parle,
# sans qu'on le lui redise.
version: 1

imports: [outils, politiques]     # modules voisins de ce fichier
agents_dir: agents/
prompts_dir: prompts/

models:
  # Orchestrateur simulé. Deux demandes, deux runs de la même session :
  #   1. « Relance … D-2026-042 … cordial » → cherche le devis, puis fait rédiger ;
  #   2. « Rends-la plus brève »            → le numéro ne figure plus dans la
  #      demande, mais l'historique de la session le lui a rappelé ; le rôle,
  #      lui, ne voit que le run, d'où un appel refusé puis une nouvelle
  #      recherche (portée `session` du contexte : 4.1b).
  - id: FAKE_MAIN
    sdk: fake
    model: fake-main
    pricing: {input: 0.30, output: 1.20}     # tarifs de MiniMax-M3
    params:
      script:
        - with_text: D-2026-042
          text: Je cherche le devis.
          tool_calls:
            - name: chercher_devis
              arguments: {numero: "D-2026-042"}
        - with_text: D-2026-042
          tool_calls:
            - name: rediger_relance
              arguments:
                ton: cordial
                consignes: Cite le numéro du devis D-2026-042 dans l'objet.
          forced: Relance du devis D-2026-042 non rédigée.
        # Le second run sait déjà de quel devis on parle et appelle le rôle
        # tout de suite. Mais le rôle déclare avoir besoin d'un résultat de
        # chercher_devis *dans le run* : son appel est refusé, et
        # l'orchestrateur cherche le devis avant de recommencer. C'est le
        # chemin qu'a pris MiniMax-M3 au run réel du 20/09.
        - without_text: D-2026-042
          text: Je reprends la relance en plus court.
          tool_calls:
            - name: rediger_relance
              arguments:
                ton: bref
                consignes: Trois phrases au plus.
        - without_text: D-2026-042
          text: Je relis le devis avant de raccourcir la relance.
          tool_calls:
            - name: chercher_devis
              arguments: {numero: "D-2026-042"}
        - without_text: D-2026-042
          tool_calls:
            - name: rediger_relance
              arguments:
                ton: bref
                consignes: >-
                  Cite le numéro du devis D-2026-042 dans l'objet.
                  Trois phrases au plus.
          forced: Relance du devis D-2026-042 non raccourcie.
  # Rôle simulé : il répond selon le ton demandé, en JSON conforme au contrat.
  - id: FAKE_ROLE
    sdk: fake
    model: fake-role
    pricing: {input: 0.15, output: 0.50}     # tarifs de GLM-5.3-Flash
    params:
      script:
        - with_text: "Ton souhaité : cordial"
          text: >-
            {"objet": "Votre devis D-2026-042",
            "corps": "Bonjour Madame Martin,\n\nJe reviens vers vous au sujet du devis D-2026-042 de 1 840 € pour le remplacement de votre chauffe-eau, envoyé le 2 septembre. Avez-vous pu en prendre connaissance ? Je reste disponible pour en parler.\n\nBien cordialement,\nPlomberie Dupont"}
        - with_text: "Ton souhaité : bref"
          text: >-
            {"objet": "Votre devis D-2026-042",
            "corps": "Bonjour Madame Martin,\n\nOù en êtes-vous du devis D-2026-042 de 1 840 €, envoyé le 2 septembre ? Un mot suffit.\n\nBien cordialement,\nPlomberie Dupont"}

  # Juge simulé : les deux relances reprennent le devis sans rien inventer.
  # Tarifs de Claude Haiku 4.5, pour voir le coût du juge s'ajouter au run.
  - id: FAKE_JUDGE
    sdk: fake
    model: fake-judge
    pricing: {input: 1.0, output: 5.0}
    params:
      script:
        - tool_calls:
            - name: verdict
              arguments:
                criteria:
                  - {name: fidele, score: 1.0, reason: "Montant, date d'envoi et objet repris du devis."}
                  - {name: ton, score: 0.9, reason: "Ton conforme à la demande."}

  # Tarifs en $ par million de tokens, relevés le 18/09/2026 ; au-delà de 512k
  # tokens d'entrée par appel, MiniMax double ses prix (palier, phase 3.4).
  - id: M3_MAIN
    sdk: anthropic
    base_url: https://api.minimax.io/anthropic
    model: MiniMax-M3
    api_key_env: M3_API_KEY
    max_tokens: 4096
    pricing:
      input: 0.30
      output: 1.20
      cache_read: 0.06
      cache_write: 0.30
      tiers:
        - {above: 512000, input: 0.60, output: 2.40, cache_read: 0.12, cache_write: 0.60}
  # GLM-5.3-Flash chez Together (API compatible OpenAI), relevé le 19/09/2026.
  - id: GLM_FLASH
    sdk: openai
    api: chat
    base_url: https://api.together.xyz/v1
    model: zai-org/GLM-5.3-Flash
    api_key_env: TOGETHER_API_KEY
    max_tokens: 4096
    pricing: {input: 0.15, output: 0.50, cache_read: 0.03}
  # Claude Haiku 4.5, juge réel (phase 3.3).
  - id: HAIKU
    sdk: anthropic
    model: claude-haiku-4-5-20251001
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 1024
    pricing: {input: 1.0, output: 5.0, cache_read: 0.10, cache_write: 1.25}

# Budgets par défaut des agents (phase 3.4), vérifiés avant chaque appel de
# l'orchestrateur. Une conversation coûte plus qu'un run isolé : le budget de
# session compte les runs précédents.
budgets:
  run: {max_cost: 0.05, max_calls: 20}
  session: {max_cost: 1.0}
  on_exceed: stop

# Vie d'une session (phase 4.1a). L'historique déjà calculé est écrit dans le
# journal dès qu'il fait gagner cinq événements de relecture : le run suivant
# en repart au lieu de rejouer toute la conversation.
sessions:
  snapshot_every: 5

storage:
  events: {backend: jsonl, path: data}   # ignoré par git

telemetry:
  logging: {level: WARNING, format: console}
