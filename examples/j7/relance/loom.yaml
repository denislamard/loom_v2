# Configuration de l'exemple du state de session : la relance de devis du
# jalon J5, pour un seul artisan, dont la session tient un state.
#
# Le state est un objet JSON que la session porte d'un run à l'autre :
#   - l'application en pose une partie à l'ouverture d'un run (`state=` en
#     Python, `--state clé=valeur` avec `loom run`) ;
#   - un outil en pose une autre par son résultat (`from:`) ;
#   - l'orchestrateur le reçoit à la fin de chaque requête (`main.context`),
#     un rôle les clés qu'il demande.
# Les clés, leurs schémas et ce qui les pose : agents/relance.yaml.
#
# Modèles simulés (sdk: fake), sans clé ni réseau.
version: 1

imports: [outils]                 # module voisin de ce fichier
agents_dir: agents/
prompts_dir: prompts/

models:
  # Orchestrateur simulé : la réponse est choisie sur la demande.
  - id: FAKE_MAIN
    sdk: fake
    model: fake-main
    pricing: {input: 0.30, output: 1.20}     # tarifs de MiniMax-M3
    params:
      script:
        - with_text: D-2026-042
          text: Je cherche le devis.
          tool_calls:
            - name: chercher_devis
              arguments: {numero: "D-2026-042"}
        - with_text: D-2026-042
          tool_calls:
            - name: rediger_relance
              arguments: {}
          forced: Relance du devis D-2026-042 non rédigée.
        # Un devis absent du carnet : rien à rédiger.
        - with_text: D-2026-999
          text: Je cherche le devis.
          tool_calls:
            - name: chercher_devis
              arguments: {numero: "D-2026-999"}
        - with_text: D-2026-999
          text: >-
            Le devis D-2026-999 ne figure pas dans votre carnet : je n'ai rien
            à relancer.
        # La suite d'une conversation : la demande ne cite aucun devis. Un vrai
        # modèle lit le numéro dans le state (devis_courant) ; le simulé le
        # connaît d'avance.
        - with_text: Refais-la
          tool_calls:
            - name: chercher_devis
              arguments: {numero: "D-2026-042"}
        - with_text: Refais-la
          tool_calls:
            - name: rediger_relance
              arguments: {}
          forced: Relance du devis D-2026-042 non rédigée.

  # Rôle simulé : il rédige au ton que le state lui donne.
  - id: FAKE_ROLE
    sdk: fake
    model: fake-role
    pricing: {input: 0.15, output: 0.50}     # tarifs de GLM-5.3-Flash
    params:
      script:
        - with_text: "Ton : ferme"
          text: >-
            {"objet": "Devis D-2026-042 : votre réponse",
            "corps": "Bonjour Madame Martin,\n\nJe n'ai pas reçu de réponse à mon devis D-2026-042 de 1 840 € pour le remplacement de votre chauffe-eau, envoyé le 2 septembre. Pouvez-vous me dire si vous souhaitez y donner suite ?\n\nCordialement,\nPlomberie Dupont"}
        - with_text: "Ton : cordial"
          text: >-
            {"objet": "Votre devis D-2026-042",
            "corps": "Bonjour Madame Martin,\n\nJe reviens vers vous au sujet du devis D-2026-042 de 1 840 € pour le remplacement de votre chauffe-eau, envoyé le 2 septembre. Avez-vous pu en prendre connaissance ? Je reste disponible pour en parler.\n\nBien cordialement,\nPlomberie Dupont"}

storage:
  events: {backend: jsonl, path: data}   # ignoré par git

telemetry:
  logging: {level: WARNING, format: console}
