# Configuration des exemples du jalon J3 : la relance de devis, fiabilisée.
# Ce dossier grandit de phase en phase jusqu'au scénario final du jalon (3.6).
#
# Deux agents, même scénario :
#   relance       modèles simulés (sdk: fake), sans clé ni réseau ;
#   relance_reel  MiniMax-M3 pour l'orchestrateur (clé dans M3_API_KEY),
#                 GLM-5.3-Flash chez Together pour le rôle (clé dans TOGETHER_API_KEY),
#                 Claude Haiku 4.5 pour le juge (clé dans ANTHROPIC_API_KEY).
#
# Phase 3.1 : politiques. Voir politiques.py (à côté) et agents/*.yaml.
# Phase 3.2 : le rôle rend un JSON {objet, corps}, sous contrat de sortie.
# Phase 3.3 : un juge vérifie que la relance n'invente rien.
version: 1

imports: [outils, politiques]     # modules voisins de ce fichier
agents_dir: agents/
prompts_dir: prompts/

models:
  # Orchestrateur simulé. Chaque réponse montre une politique à l'œuvre :
  #   1. numéro mal formé           → numero_devis refuse l'appel (Deny) ;
  #   2. numéro en minuscules       → numero_devis le normalise (Replace) ;
  #   3. relance sans numéro        → cite_le_devis la refuse (Retry) ;
  #   4. relance avec des consignes → acceptée.
  # « forced » : la réponse donnée à la place des appels d'outils quand le run
  # est arrêté (plafond_appels, puis réponse forcée sans outils).
  - id: FAKE_MAIN
    sdk: fake
    model: fake-main
    params:
      script:
        - text: Je cherche le devis.
          tool_calls:
            - name: chercher_devis
              arguments: {numero: "42"}
        - text: Je corrige le numéro.
          tool_calls:
            - name: chercher_devis
              arguments: {numero: " d-2026-042 "}
        - tool_calls:
            - name: rediger_relance
              arguments: {ton: cordial}
          forced: >-
            Devis D-2026-042 trouvé (Mme Martin, 1 840 €, envoyé le 2 septembre),
            mais la relance n'a pas été rédigée : plafond d'appels atteint.
        - tool_calls:
            - name: rediger_relance
              arguments:
                ton: cordial
                consignes: Cite le numéro du devis D-2026-042 dans l'objet.
          forced: >-
            Devis D-2026-042 trouvé, relance non rédigée : plafond d'appels atteint.
  # Rôle simulé : il répond selon qu'on lui demande ou non de citer le numéro.
  # Sa première réponse enveloppe le JSON dans du texte et un bloc de code : la
  # normalisation du contrat de sortie l'en extrait (phase 3.2).
  - id: FAKE_ROLE
    sdk: fake
    model: fake-role
    params:
      script:
        - without_text: Cite le numéro
          text: |-
            Voici l'e-mail de relance :

            ```json
            {"objet": "Votre projet de chauffe-eau",
             "corps": "Bonjour Madame Martin,\n\nJe reviens vers vous au sujet de notre proposition de 1 840 € pour le remplacement de votre chauffe-eau, envoyée le 2 septembre. Avez-vous pu en prendre connaissance ?\n\nBien cordialement,\nPlomberie Dupont"}
            ```
        - with_text: Cite le numéro
          text: >-
            {"objet": "Votre devis D-2026-042",
            "corps": "Bonjour Madame Martin,\n\nJe reviens vers vous au sujet du devis D-2026-042 de 1 840 € pour le remplacement de votre chauffe-eau, envoyé le 2 septembre. Avez-vous pu en prendre connaissance ? Je reste disponible pour en parler.\n\nBien cordialement,\nPlomberie Dupont"}

  # Juge simulé (phase 3.3) : il refuse une relance qui promet une réduction de
  # 10 % (absente du devis), et accepte les autres. Tarifs de Claude Haiku 4.5,
  # pour voir le coût du juge s'ajouter à celui du run.
  - id: FAKE_JUDGE
    sdk: fake
    model: fake-judge
    pricing: {input: 1.0, output: 5.0}
    params:
      script:
        - with_text: 10 %
          tool_calls:
            - name: verdict
              arguments:
                criteria:
                  - {name: fidele, score: 0.1, reason: "La réduction de 10 % ne figure ni dans le devis ni dans la demande."}
                  - {name: ton, score: 0.9, reason: "Ton cordial, comme demandé."}
        - without_text: 10 %
          tool_calls:
            - name: verdict
              arguments:
                criteria:
                  - {name: fidele, score: 1.0, reason: "Montant, date d'envoi et objet repris du devis."}
                  - {name: ton, score: 0.9, reason: "Ton cordial, comme demandé."}

  # Tarifs en $ par million de tokens, relevés le 18/09/2026 (palier ≤ 512k tokens).
  - id: M3_MAIN
    sdk: anthropic
    base_url: https://api.minimax.io/anthropic
    model: MiniMax-M3
    api_key_env: M3_API_KEY
    max_tokens: 4096
    pricing: {input: 0.30, output: 1.20, cache_read: 0.06, cache_write: 0.30}
  # GLM-5.3-Flash chez Together (API compatible OpenAI), relevé le 19/09/2026.
  - id: GLM_FLASH
    sdk: openai
    api: chat
    base_url: https://api.together.xyz/v1
    model: zai-org/GLM-5.3-Flash
    api_key_env: TOGETHER_API_KEY
    max_tokens: 4096
    pricing: {input: 0.15, output: 0.50, cache_read: 0.03}
  # Claude Haiku 4.5, juge réel (phase 3.3) ; tarifs repris de examples/j2/assistant.
  - id: HAIKU
    sdk: anthropic
    model: claude-haiku-4-5-20251001
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 1024
    pricing: {input: 1.0, output: 5.0, cache_read: 0.10, cache_write: 1.25}

storage:
  events: {backend: jsonl, path: data}   # ignoré par git

telemetry:
  logging: {level: WARNING, format: console}
