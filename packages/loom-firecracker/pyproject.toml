[project]
name = "loom-firecracker"
version = "0.1.0.dev0"
description = "Firecracker microVM sandbox for loom: execd host client and the forge tool source."
authors = [
    { name = "Denis Lamard", email = "lamard.denis@gmail.com" }
]
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.26.0",
    "loom-ia",
]

# La source d'outils « forge » (J6.4c), déclarée dans tool_sources.
[project.entry-points."loom_ia.tools"]
forge = "loom_firecracker.forge:forge_source"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
loom-ia = { workspace = true }
