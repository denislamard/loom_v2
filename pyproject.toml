[project]
name = "loom-ia"
version = "2.0.15"
description = "Moteur d'agents IA en Python asynchrone : rôles délégués à des modèles, outils Python et MCP, runs journalisés, rejouables et reprenables, en librairie Python, API REST ou serveur MCP."
readme = "README.md"
authors = [
    { name = "Denis Lamard", email = "lamard.denis@gmail.com" }
]
requires-python = ">=3.14"
keywords = ["agents", "llm", "ia", "mcp", "orchestration", "event-sourcing", "anthropic", "openai"]
classifiers = [
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Natural Language :: French",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
# Bornes hautes sur les dépendances dont une version majeure peut casser l'API
# (noyau et SDK des extras). cryptography reste sans borne : ses correctifs de
# sécurité arrivent dans de nouvelles majeures.
dependencies = [
    # tools_builtin/fetch_page.py (outil fourni loom.fetch_page) importe httpx2 : une
    # dépendance du noyau plutôt qu'un extra (décision D1 du 16/10). Plancher : la version
    # que la CI éprouve (groupe dev, job des bornes basses).
    "httpx2>=2.13.0,<3",
    # core/bounded_regex.py copie des fonctions privées de jsonschema (modules _keywords,
    # _legacy_keywords, _utils) : une version mineure peut les renommer, ou en ajouter une
    # qui cherche un motif sans délai. Relever la borne, c'est relire ce module avec
    # test_jsonschema_has_no_other_function_that_searches_a_pattern (le workflow
    # hebdomadaire n'installe pas ce que la borne exclut).
    "jsonschema>=4.26.0,<4.27",
    # core/bounded_regex.py importe directement jsonschema_specifications et referencing
    # (méta-schémas, résolution des $ref) : ce sont des dépendances de jsonschema, mais un
    # import direct se déclare. Leurs planchers sont ceux que jsonschema 4.26 exige.
    "jsonschema-specifications>=2023.3.6",
    "pydantic>=2.12.2,<3",
    # config/env_file.py lit le .env d'un projet au démarrage de `loom` : son analyseur
    # (dotenv.parser), sans interpolation, dit la ligne illisible au lieu de la sauter.
    # Plancher : la plus basse version éprouvée par les tests (job des bornes basses).
    "python-dotenv>=1.0.1,<2",
    "pyyaml>=6.0.3,<7",
    "referencing>=0.28.4,<1",
    "regex>=2025.7.29",
]

# Les paquets que le code d'un extra importe directement (httpx, httpx2, anyio, starlette)
# y sont déclarés aussi, même quand le SDK les tire déjà ; planchers = ceux du SDK.
# tests/unit/test_dependances.py le vérifie.
[project.optional-dependencies]
anthropic = [
    "anthropic>=1.6.0,<2",
    "httpx2>=2.0.0,<3",
]
openai = [
    "httpx2>=2.7.0,<3",
    "openai>=3.14.1,<4",
]
mcp = [
    "anyio>=4.5",
    "httpx>=0.27.1,<1",
    "mcp>=1.30.0,<2",
    "starlette>=0.48.0",
]
http = [
    "fastapi>=0.141.1,<1",
    "python-multipart>=0.0.32",
    "sse-starlette>=3.4.11,<4",
    "starlette>=0.48.0",
    "uvicorn>=0.53.0",
    "watchfiles>=1.3.0",
]
sqlite = [
    "aiosqlite>=0.22.1",
]
crypto = [
    "cryptography>=50.0.1",
]
# tools_builtin/excel.py (outil fourni loom.excel) écrit les classeurs avec openpyxl ;
# son module ne l'importe qu'au montage d'un agent qui l'active.
office = [
    "openpyxl>=3.1.5,<4",
]
postgres = [
    "asyncpg>=0.31.0",
]
# tools_builtin/sql (outil fourni loom.sql) analyse chaque instruction avec sqlglot et
# parle à Postgres par asyncpg (SQLite : la bibliothèque standard) ; son module ne les
# importe qu'au montage d'un agent qui l'active. sqlglot change d'API d'une majeure à
# l'autre : la borne haute suit celle qu'éprouvent les tests de l'analyse.
sql = [
    "asyncpg>=0.31.0",
    "sqlglot>=30.24.0,<31",
]
rabbitmq = [
    "aio-pika>=10.0.1,<11",
]
redis = [
    "redis>=8.1.0,<9",
]
otel = [
    "opentelemetry-exporter-otlp>=1.44.0,<2",
    "opentelemetry-sdk>=1.44.0,<2",
]
all = [
    "loom-ia[anthropic,openai,mcp,http,sqlite,postgres,rabbitmq,redis,otel,crypto,office,sql]",
]

[project.urls]
Repository = "https://github.com/denislamard/loom_v2"
Issues = "https://github.com/denislamard/loom_v2/issues"

[project.scripts]
loom = "loom_ia.access.cli:main"

# La source d'outils « forge » (J6.4c) : la sandbox Firecracker, déclarée dans
# tool_sources ; son module n'est importé que si un agent la référence.
[project.entry-points."loom_ia.tools"]
forge = "loom_ia.adapters.firecracker.forge:forge_source"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "import-linter>=2.15",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "types-jsonschema>=4.26.0.20260518",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml>=6.0.12.20260906",
    "types-regex>=2025.7.34.20250809",
]
# Types des paquets d'extras, pour pyright : ils tirent le paquet lui-même
# (asyncpg-stubs dépend d'asyncpg), donc ils restent hors de `dev` — sinon la
# passe « noyau seul » n'éprouverait plus le refus d'un extra absent.
# Vérification complète : uv sync --all-extras --group types
types = [
    "asyncpg-stubs>=0.31.3",
]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py314"
# execd tourne dans la VM, sous le Python de son image (3.12, Ubuntu 24.04).
per-file-target-version = { "firecracker/**/*.py" = "py312" }

[tool.ruff.format]
# Les blocs de code des fichiers Markdown (README) restent tels qu'écrits.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests", "examples", "scripts"]

[tool.pytest.ini_options]
# Une marque mal écrite ou une clé de configuration inconnue est une erreur, pas un avertissement.
addopts = ["--strict-markers", "--strict-config"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: lance de vrais sous-process ou un service externe (plus lent)"]

# Couverture en branches, pour toute mesure (`--cov=loom_ia`) ; le seuil est dans `ci.yml`.
[tool.coverage.run]
branch = true

[tool.importlinter]
root_package = "loom_ia"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Couches"
type = "layers"
layers = [
    "loom_ia.access",
    "loom_ia.runtime",
    "loom_ia.tenancy",
    "loom_ia.sessions",
    "loom_ia.engine",
    "loom_ia.core",
]

[[tool.importlinter.contracts]]
name = "Noyau et moteur sans adaptateurs ni SDK"
type = "forbidden"
source_modules = ["loom_ia.core", "loom_ia.engine"]
forbidden_modules = ["loom_ia.adapters", "anthropic", "openai", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
name = "Noyau indépendant du reste de loom_ia"
type = "forbidden"
source_modules = ["loom_ia.core"]
forbidden_modules = [
    "loom_ia.access",
    "loom_ia.adapters",
    "loom_ia.agents",
    "loom_ia.config",
    "loom_ia.engine",
    "loom_ia.guards",
    "loom_ia.policies",
    "loom_ia.replay",
    "loom_ia.runtime",
    "loom_ia.sessions",
    "loom_ia.telemetry",
    "loom_ia.tenancy",
    "loom_ia.testing",
    "loom_ia.tools",
    "loom_ia.tools_builtin",
    "loom_ia.usage",
]

[[tool.importlinter.contracts]]
name = "Moteur indépendant de la config, des clients, des outils et du kit de test"
type = "forbidden"
source_modules = ["loom_ia.engine"]
forbidden_modules = [
    "loom_ia.agents",
    "loom_ia.config",
    "loom_ia.guards",
    "loom_ia.policies",
    "loom_ia.sessions",
    "loom_ia.tenancy",
    "loom_ia.testing",
    "loom_ia.tools",
    "loom_ia.tools_builtin",
    "loom_ia.usage",
]

[[tool.importlinter.contracts]]
name = "Adaptateurs indépendants"
type = "independence"
modules = [
    "loom_ia.adapters.crypto",
    "loom_ia.adapters.models",
    "loom_ia.adapters.stores",
    "loom_ia.adapters.artifacts",
    "loom_ia.adapters.bus",
    "loom_ia.adapters.queue",
    "loom_ia.adapters.mcp",
    "loom_ia.adapters.telemetry",
    "loom_ia.adapters.idempotency",
    "loom_ia.adapters.usage",
    "loom_ia.adapters.firecracker",
]
