# default.yaml — le style de base, livré avec loom : les valeurs des styles de Word
# (Microsoft 365, thème Office 2023 : Aptos, titres 0F4761), et rien de plus. Les styles
# propres à loom (note, en-tête et total de tableau, code…) n'ont ni fond, ni filet, ni
# couleur : le décor vient de la charte.
#
# Le point de départ de tout document : la charte d'un outil (style:) et le style d'un
# modèle de document reprennent ces noms et n'écrivent que ce qui change, propriété par
# propriété. Tailles et espacements en points ; marges, retraits et largeurs en
# centimètres ; couleurs en six chiffres hexadécimaux, ou par un nom défini dans colors.
# Un style sans base part de text.

colors: {}
page: { size: A4, orientation: portrait, margins: 2 }
numbering: none
language: fr
image: { grid: false }
chart:
  colors: [156082, E97132, 196B24, 0F9ED5, A02B93, 4EA72E, 0D3A4E, 994010, 0F4016, 095F80, 601A58, 2F641C]
  text: 595959
  grid: D9D9D9
  title: 595959

text: { font: Aptos, size: 12, line_spacing: 1.16, space_after: 8 }
document_title: { size: 28, space_after: 4 }
heading1: { size: 20, color: 0F4761, space_before: 18, space_after: 4 }
heading2: { size: 16, color: 0F4761, space_before: 8, space_after: 4 }
heading3: { size: 14, color: 0F4761, space_before: 8, space_after: 4 }
paragraph: {}
list: { space_after: 3 }
note: { indent: 0.3, space_before: 6, space_after: 10 }
quote: { italic: true, color: 404040, align: center, space_before: 8 }
quote_source: { italic: false, align: right }
caption: { size: 9, italic: true, color: 0E2841, line_spacing: 1, space_after: 10, numbered: false }

table:
  size: 10
  line_spacing: 1
  space_after: 0
  borders: grid
  line: 0.5pt 000000
  width: full
  position: left
table_header: { bold: true }
table_total: { bold: true }
table_group: { bold: true }
table_subtotal: { italic: true }
invoice_totals: { width: content, position: right }
attendance: { row_height: 1.5 }
box: { border: 0.5pt 000000 }
code: { font: Courier New, size: 10, line_spacing: 1, indent: 0.3 }
link: { color: 467886, underline: true }
footnote: { size: 10, line_spacing: 1, space_after: 0 }
fields: { label_width: 4, space_after: 2 }
fields_label: { bold: true }

toc: { base: heading1, levels: 2, page_numbers: true }
signature: { bold: true, space_before: 12, space_after: 3 }
signature_mention: { italic: true, space_after: 3 }
header: { line_spacing: 1, space_after: 0 }
footer: { line_spacing: 1, space_after: 0, align: center, center: "Page {page} / {pages}" }
watermark: { text: "", font: Arial, color: D9D9D9 }
