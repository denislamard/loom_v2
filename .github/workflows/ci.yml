# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Version d'uv épinglée, la même que dans publish.yml. L'uv local peut être plus
  # récent : uv.lock est vérifié tel quel (--locked), il doit rester lisible par celle-ci.
  UV_VERSION: "0.11.14"

defaults:
  run:
    shell: bash

jobs:
  qualite:
    name: Qualité (ruff, pyright, import-linter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: ${{ github.job }}

      # --locked échoue si uv.lock n'est pas à jour avec pyproject.toml.
      # --group types : les stubs des extras (asyncpg-stubs), sans lesquels pyright
      # ne connaît pas les types d'asyncpg.
      - name: Installer le projet (tous les extras, et leurs types)
        run: uv sync --locked --all-extras --group types

      - name: Ruff (lint)
        run: uv run --locked ruff check .

      - name: Ruff (format)
        run: uv run --locked ruff format --check .

      - name: Pyright (strict)
        run: uv run --locked pyright

      - name: Contrats d'import
        run: uv run --locked lint-imports

  tests-noyau:
    name: Tests (noyau seul)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Installer le projet (aucun extra)
        run: uv sync --locked

      - name: Le noyau s'importe sans SDK
        run: |
          uv run --locked python - <<'EOF'
          import importlib.util

          import loom_ia  # noqa: F401

          extras = ["anthropic", "openai", "fastapi", "mcp"]
          installes = [m for m in extras if importlib.util.find_spec(m) is not None]
          if installes:
              raise SystemExit(f"Modules d'extras installés sans être demandés : {installes}")
          print("Noyau importé, aucun module d'extra installé.")
          EOF

      - name: Tests
        run: uv run --locked pytest

  tests-complets:
    name: Tests (tous les extras, avec les services)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Les essais de service tournent ici, et nulle part ailleurs : journal
    # Postgres et politique de lignes, reprise d'un run sur un autre worker,
    # bus et idempotence Redis. Versions épinglées sur celles qui servent à
    # vérifier une phase avant de la rendre (Postgres 16, Redis 7,
    # RabbitMQ 3.12) : la CI éprouve ce qui a été éprouvé à la main.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.12
        # Un utilisateur à soi, et non `guest` : RabbitMQ ne laisse `guest`
        # entrer que depuis la boucle locale, et un port publié n'en est pas.
        env:
          RABBITMQ_DEFAULT_USER: loom
          RABBITMQ_DEFAULT_PASS: loom
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      LOOM_TEST_POSTGRES: postgresql://loom:loom@127.0.0.1:5432/loom
      LOOM_TEST_RABBITMQ: amqp://loom:loom@127.0.0.1:5672/
      LOOM_TEST_REDIS: redis://127.0.0.1:6379/1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: ${{ github.job }}

      # Le rôle du DSN n'est **pas** superutilisateur : un superutilisateur
      # contourne la sécurité au niveau des lignes, et les essais passeraient
      # sans rien prouver — `tests/conftest.py` échoue donc exprès dans ce cas.
      # Il a en revanche CREATEROLE : le stockage crée son rôle applicatif
      # (`loom_app`, NOLOGIN) à la première requête, et un essai de la barrière
      # crée un rôle étranger pour se faire refuser.
      - name: Rôle Postgres ordinaire, propriétaire de sa base
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE loom LOGIN PASSWORD 'loom' NOSUPERUSER CREATEROLE"
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE loom OWNER loom"

      - name: Installer le projet (tous les extras)
        run: uv sync --locked --all-extras

      # `--require-services` : une variable absente ou un extra manquant devient
      # un échec au lieu d'un saut. Sans lui, un conteneur tombé ou une variable
      # mal écrite rendrait un job vert qui n'a rien éprouvé — exactement ce que
      # cette CI faisait avant d'avoir des services.
      - name: Tests avec couverture
        run: uv run --locked pytest --require-services --cov=loom_ia --cov-report=term-missing

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: ${{ github.job }}

      - name: Construire le sdist et le wheel
        run: uv build

      - name: Vérifier les métadonnées et le README (twine)
        run: uvx twine check --strict dist/*

      - name: Vérifier le wheel
        run: |
          python3 - <<'EOF'
          import glob
          import zipfile

          (wheel,) = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as zf:
              noms = zf.namelist()
              metadata = next(n for n in noms if n.endswith(".dist-info/METADATA"))
              contenu = zf.read(metadata).decode()

          erreurs = []
          if "loom_ia/py.typed" not in noms:
              erreurs.append("py.typed absent")
          if not any(n.endswith(".dist-info/licenses/LICENSE") for n in noms):
              erreurs.append("LICENSE absente")
          if "License-Expression: Apache-2.0" not in contenu:
              erreurs.append("License-Expression incorrecte")
          if erreurs:
              raise SystemExit(f"{wheel} : " + ", ".join(erreurs))
          print(f"{wheel} : OK")
          EOF
