# SPDX-License-Identifier: Apache-2.0
name: Publication

# À la main (Actions > Publication > Run workflow) : TestPyPI.
# Sur une étiquette v<version> : PyPI, après accord si l'environnement `pypi` l'exige.
# Les deux passent par la publication de confiance (OIDC) : aucun jeton dans le dépôt.
# Les deux attendent la CI complète (ci.yml, appelée ci-dessous) : une étiquette n'a pas d'autre
# CI, et une CI rouge, annulée ou ignorée saute la construction, donc les deux publications.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Une publication en cours n'est jamais annulée par une autre.
concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

env:
  # Version d'uv épinglée, la même que dans ci.yml. L'uv local peut être plus récent :
  # uv.lock est vérifié tel quel (--locked), il doit rester lisible par celle-ci.
  UV_VERSION: "0.11.14"

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Construire
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: L'étiquette correspond à la version du pyproject
        if: github.ref_type == 'tag'
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "étiquette $GITHUB_REF_NAME, version $version dans pyproject.toml"
            exit 1
          fi

      - name: Construire le sdist et le wheel
        run: uv build

      - name: Vérifier les métadonnées et le README (twine)
        run: uvx --from twine==7.0.0 twine check --strict dist/*

      - name: Essayer le wheel dans un environnement vierge
        # Ce que `twine` et l'inspection du zip ne voient pas : une dépendance déclarée en trop
        # peu, un point d'entrée mal posé, un fichier du paquet manquant. Le wheel est installé
        # seul, hors du dépôt, puis la CLI valide une config et lance un run avec un modèle simulé.
        run: |
          set -euo pipefail
          wheel=$(ls "$PWD"/dist/*.whl)
          pyproject="$PWD/pyproject.toml"
          smoke=$(mktemp -d)
          uv venv "$smoke/venv" --python 3.14
          version=$("$smoke/venv/bin/python" -c "import sys, tomllib; print(tomllib.load(open(sys.argv[1], 'rb'))['project']['version'])" "$pyproject")
          uv pip install --python "$smoke/venv/bin/python" "$wheel"
          mkdir -p "$smoke/cfg/agents" "$smoke/cfg/prompts"
          cat > "$smoke/cfg/loom.yaml" <<'YAML'
          version: 1
          agents_dir: agents/
          prompts_dir: prompts/
          models:
            - id: FAKE
              sdk: fake
              model: fake-1
              params:
                script:
                  - text: ok
          YAML
          cat > "$smoke/cfg/agents/smoke.yaml" <<'YAML'
          name: smoke
          description: Essai du wheel.
          main:
            model: FAKE
            system_file: smoke.md
          max_iterations: 2
          YAML
          echo "Réponds." > "$smoke/cfg/prompts/smoke.md"
          # Hors du dépôt, interpréteur isolé : seul le wheel installé peut être importé.
          cd "$smoke"
          loom="$smoke/venv/bin/loom"
          "$smoke/venv/bin/python" -I -c "import loom_ia; assert 'site-packages' in loom_ia.__file__, loom_ia.__file__"
          test "$("$loom" --version)" = "loom $version"
          test "$("$smoke/venv/bin/python" -m loom_ia --version)" = "loom $version"
          "$loom" --help > /dev/null
          "$loom" schema > /dev/null
          "$loom" --config cfg/loom.yaml validate | tee validate.txt
          grep -q "✓ 1 agent monté" validate.txt
          grep -q "forge · loom-ia $version" validate.txt
          "$loom" --config cfg/loom.yaml run smoke "bonjour" 2> /dev/null | tee run.txt
          grep -qx "ok" run.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  testpypi:
    name: TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/loom-ia
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: PyPI
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/loom-ia
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
