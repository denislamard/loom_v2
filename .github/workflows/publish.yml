# SPDX-License-Identifier: Apache-2.0
name: Publication

# À la main (Actions > Publication > Run workflow) : TestPyPI.
# Sur une étiquette v<version> : PyPI, après accord si l'environnement `pypi` l'exige.
# Les deux passent par la publication de confiance (OIDC) : aucun jeton dans le dépôt.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Une publication en cours n'est jamais annulée par une autre.
concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

env:
  # La même version d'uv que la CI et qu'en local.
  UV_VERSION: "0.11.14"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Construire
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: L'étiquette correspond à la version du pyproject
        if: github.ref_type == 'tag'
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "étiquette $GITHUB_REF_NAME, version $version dans pyproject.toml"
            exit 1
          fi

      - name: Construire le sdist et le wheel
        run: uv build

      - name: Vérifier les métadonnées et le README (twine)
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  testpypi:
    name: TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/loom-ia
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: PyPI
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/loom-ia
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
